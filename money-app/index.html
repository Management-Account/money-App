<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Ledger</title>
  <meta name="description" content="A simple, offline-first money manager.">
  <meta name="theme-color" content="#0a0f2c">
  <script>try{var t=JSON.parse(localStorage.getItem("pocketledger.v1")||"{}").settings.theme;if(/^(neon|soft|aurora|crystal|liquid|mintnm|indigonm|knobs|ocean|sunset)$/.test(t))document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <main id="main" class="main"></main>
  </div>
  <button class="fab" id="fab" aria-label="Add transaction">+</button>
  <dialog id="dlg"></dialog>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file" accept=".csv,.json,text/csv,application/json" hidden>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
